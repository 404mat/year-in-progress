name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Zip app
        run: |
          ditto -c -k --sextetIcon --keepParent "Year In Progress.app" "Year-In-Progress.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Year-In-Progress.zip
